<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTD Brain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="overflow-hidden">

  <!-- Three.js canvas (background) -->
  <canvas id="bg-canvas"></canvas>

  <!-- App shell -->
  <div id="app">

    <!-- Header -->
    <header id="header">
      <div class="header-logo">
        <span class="logo-dot"></span>
        <span class="logo-text">GTD Brain</span>
      </div>
      <div class="header-right">
        <button id="review-btn" class="refs-toggle-btn" title="Weekly Review">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Review
        </button>
        <button id="refs-btn" class="refs-toggle-btn" title="Referencias (R)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Ref
        </button>
        <div class="header-status">
          <span id="api-status" class="status-dot offline" title="API status"></span>
          <span id="api-label" class="status-label">conectando…</span>
        </div>
      </div>
    </header>

    <!-- References panel (slide-in from right) -->
    <div id="refs-panel" class="refs-panel">
      <div class="refs-header">
        <span class="refs-title">Referencias</span>
        <input id="refs-search" class="refs-search" placeholder="Buscar…" autocomplete="off" spellcheck="false" />
        <button id="refs-close" class="refs-close-btn" title="Cerrar">✕</button>
      </div>
      <div id="refs-body" class="refs-body"></div>
    </div>

    <!-- Main layout -->
    <main id="main">

      <!-- Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-header">
          <div class="bucket-tabs">
            <button class="tab-btn active" data-bucket="today">Hoy</button>
            <button class="tab-btn" data-bucket="backlog">Backlog</button>
            <button class="tab-btn" data-bucket="waiting">Waiting</button>
            <button class="tab-btn" data-bucket="someday">Someday</button>
          </div>
        </div>

        <div id="bucket-counts" class="bucket-counts"></div>

        <div id="tag-bar" class="tag-bar"></div>

        <div id="items-list" class="items-list">
          <div class="empty-state">
            <p>Sin ítems</p>
          </div>
        </div>
      </aside>

      <!-- Chat panel -->
      <section id="chat-panel">
        <div id="messages" class="messages"></div>

        <div id="chat-input-area">
          <div class="input-wrapper">
            <textarea
              id="chat-input"
              placeholder="Escribí algo para capturar… (Enter para enviar)"
              rows="1"
              autocomplete="off"
              spellcheck="false"
            ></textarea>
            <button id="mic-btn" aria-label="Grabar voz" title="Grabar voz">
              <svg id="mic-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>
            <button id="send-btn" aria-label="Enviar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
          <p class="input-hint">Enter → enviar &nbsp;·&nbsp; Shift+Enter → nueva línea &nbsp;·&nbsp; 🎤 → voz</p>
        </div>
      </section>

    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
